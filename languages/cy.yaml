  EMAIL_CHANGE_EMAIL_BODY: '<h1>Cadarnha dy gyfeiriad ebost</h1><p>Helo %1$s,</p><p>Gofynnaist am newid y cyfeiriad ebost ar dy gyfrif <b>%3$s</b> i’r un hwn. Clicia’r botwm isod i’w gadarnhau. Bydd dy gyfrif yn cadw ei gyfeiriad presennol nes i ti wneud hynny.</p><p><br/><a href="%2$s" class="btn-primary">Cadarnha dy gyfeiriad ebost</a><br/><br/></p><p>Fel arall, copïa’r ddolen hon i dy borwr:</p><p class="word-break"><a href="%2$s">%2$s</a></p><p>Mae’r ddolen yn gweithio am 24 awr. Os na ofynnaist am y newid hwn, anwybydda’r ebost hwn a fydd dim byd yn newid.</p><p><br/>Cofion cynnes,<br/><br/>%4$s</p>'
