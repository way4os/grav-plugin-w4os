  EMAIL_CHANGE_REQUESTED_EMAIL_BODY: '<h1>Cais i newid ebost</h1><p>Helo %1$s,</p><p>Mae rhywun wedi gofyn am newid y cyfeiriad ebost ar dy gyfrif <b>%2$s</b> i <b>%3$s</b>. Fydd dim byd yn newid nes i’r ddolen a anfonon ni i’r cyfeiriad hwnnw gael ei hagor.</p><p>Os ti oedd e, does dim byd i’w wneud. Os nad ti oedd e, cansla’r newid nawr:</p><p><br/><a href="%4$s" class="btn-primary">Canslo’r newid</a><br/><br/></p><p>Fel arall, copïa’r ddolen hon i dy borwr:</p><p class="word-break"><a href="%4$s">%4$s</a></p><p>Yna newidia dy gyfrinair, neu cysyllta â pherchennog y safle, gan y gallai rhywun arall fewngofnodi i dy gyfrif.</p><p><br/>Cofion cynnes,<br/><br/>%5$s</p>'
  EMAIL_CHANGE_CANCELLED_BY_LINK: 'Mae’r newid ebost wedi’i ganslo ac mae dy gyfrif yn dal i ddefnyddio %s. Os na ofynnaist amdano, gallai rhywun arall fewngofnodi i dy gyfrif, felly newidia dy gyfrinair neu cysyllta â pherchennog y safle.'
