enabled: true
# The engine of the grid, where the site asks everything:
#   remote   the engine API of the grid, served by its helpers (url, api_key below): the site can be anywhere
#   bundled  the engine and the helpers the plugin bundles (its vendor folder), used as libraries: no API, no key; the grid is
#            described under "bundled" below. Needs the PHP extensions of the engine (pdo_mysql, mysqli; imagick for the pictures).
engine: remote
# Serve the helpers of the grid on this site, the ones the plugin bundles (with engine: bundled): what the viewers and the simulators
# ask (welcome, search, profiles, economy, offline messages, guide...) at the addresses the config of the grid gives, which must be
# the ones of this site (its WebURL, /helpers). Off: the grid keeps its own helpers, at the address below.
serve_helpers: false
# The address of the helpers of the grid, where its blocks are (https://grid.example.org/helpers). The engine API is served there
# under /api unless api_url says otherwise.
url: ''
# The address of the engine API, when it is not the /api of the helpers
api_url: ''
# The nick of the grid, when the API serves several grids (its addresses are then /grids/{grid}/...); empty for the API of one grid.
# With the bundled engine and an OpenSim install on this server: the grid of the install, empty for its only grid.
grid: ''
# The grid of the bundled engine (engine: bundled): an OpenSim install of this server, or a grid described by its login address
# and the database of its Robust.
bundled:
  # The login address of the grid (http://grid.example.org:8002): its name and its addresses come from it (get_grid_info).
  # Empty: the grid of the OpenSim install of this server (its opensim.conf, found or given below).
  login: ''
  # The database of its Robust. The password typed on the settings page is kept in user-data://w4os/database.json (never in this
  # file nor in git); the environment can set it too (GRAV_CONFIG__PLUGINS__W4OS__BUNDLED__DATABASE__PASSWORD).
  database:
    host: localhost
    port: 3306
    name: ''
    user: ''
  # The opensim.conf of the install of this server, when it is not in one of the usual places
  opensim_conf: ''
# The API key of the site, made on the machine of the grid: opensim api-key create <label>. Typed on the settings page of the
# plugin, which keeps it in user-data://w4os/api.json (never in this file nor in git). The environment (GRAV_CONFIG__PLUGINS__W4OS__API_KEY)
# can set it too.
# api_key: ''
# The engine mails the links (confirmation, new password). Off on a test site only: nothing is mailed, the links of the
# registrations and of the email changes are shown on the page (the one of a new password never is: the API gives it)
send_mail: true
# The style sheet of the plugin (its pages, the models picker, the blocks); off when the theme styles them
built_in_css: true
# How long (seconds) the blocks of the helpers (but the search) and the avatar models are kept before being read again
cache: 60
register:
  # Registration on the site: off, nobody registers here
  enabled: true
  # The new avatar is inactive until it confirms its email with the link the engine mails it
  confirm_email: true
  # A page of the site the visitor must agree to (terms of service), as its route; empty for none
  terms: ''
# Keep a Grav account (user/accounts) for each avatar that signs in. Off: the avatar lives in the session only. The API plugin of
# Grav needs one: it is kept anyway when that plugin is on.
# The list of the avatars for the managers
manage:
  per_page: 50
save_accounts: false
# The pages of the plugin, served unless the site has a page at that route. The sign-in page is the one of the Login plugin
# (/login); its "forgot password" button leads to its route_forgot, which is the one of this plugin by default.
routes:
  register: /register
  confirm: /register/confirm
  forgot: /forgot_password
  reset: /reset-password
  account: /account
  # The managers' dashboard: the blocks of its page (pages/dashboard.md), the first entry of the admin menu (not /admin: Grav's Admin plugin)
  dashboard: /account/dashboard
  manage: /account/avatars
  edit: /account/avatars/edit
  regions: /account/regions
  region: /account/regions/region
  # The pages of the grid the site serves (the grid's config gives these addresses to the viewers): a block of the helpers each
  search: /search
  profile: /profile
  guide: /guide
  # The pictures of the grid (the models), served by the bundled engine
  assets: /grid-assets
