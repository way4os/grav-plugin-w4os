name: W4OS
slug: w4os
type: plugin
version: 0.1.0
description: The website of an OpenSimulator grid, as a thin bridge to the OpenSim engine API - avatars register with a model and confirm their email, sign in, manage their account and find a new password; the managers of the grid manage the avatars; pages show the blocks of the helpers.
icon: globe
license: AGPL-3.0-or-later
author:
  name: Magìiíc
homepage: https://w4os.org
keywords: opensimulator, opensim, grid, avatar, metaverse
dependencies:
  - { name: grav, version: '>=2.0.0' }
  - { name: form, version: '>=8.0.0' }
  - { name: login, version: '>=3.8.2' }
  - { name: shortcode-core, version: '>=5.0.0' }
form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 1
      options: { 1: PLUGIN_ADMIN.ENABLED, 0: PLUGIN_ADMIN.DISABLED }
      validate: { type: bool }

    tabs:
      type: tabs
      classes: side-tabs
      fields:
        tab_connection:
          type: tab
          title: PLUGIN_W4OS.ADMIN_TAB_CONNECTION
          fields:
            url:
              type: url
              label: PLUGIN_W4OS.ADMIN_URL
              help: PLUGIN_W4OS.ADMIN_URL_HELP
              placeholder: 'https://grid.example.org/helpers'
            api_key:
              type: password
              label: PLUGIN_W4OS.ADMIN_API_KEY
              help: PLUGIN_W4OS.ADMIN_API_KEY_HELP
              data-placeholder@: '\Grav\Plugin\W4osPlugin::adminKeyPlaceholder'
            api_url:
              type: url
              label: PLUGIN_W4OS.ADMIN_API_URL
              help: PLUGIN_W4OS.ADMIN_API_URL_HELP
              placeholder: 'https://grid.example.org/helpers/api'
            grid:
              type: text
              label: PLUGIN_W4OS.ADMIN_GRID
              help: PLUGIN_W4OS.ADMIN_GRID_HELP
            built_in_css:
              type: toggle
              label: PLUGIN_W4OS.ADMIN_BUILT_IN_CSS
              help: PLUGIN_W4OS.ADMIN_BUILT_IN_CSS_HELP
              options: { 1: PLUGIN_ADMIN.ENABLED, 0: PLUGIN_ADMIN.DISABLED }
              validate: { type: bool }
            cache:
              type: number
              label: PLUGIN_W4OS.ADMIN_CACHE
              validate: { type: int, min: 0 }

        tab_accounts:
          type: tab
          title: PLUGIN_W4OS.ADMIN_TAB_ACCOUNTS
          fields:
            register.enabled:
              type: toggle
              label: PLUGIN_W4OS.ADMIN_REGISTER
              options: { 1: PLUGIN_ADMIN.ENABLED, 0: PLUGIN_ADMIN.DISABLED }
              validate: { type: bool }
            register.confirm_email:
              type: toggle
              label: PLUGIN_W4OS.ADMIN_CONFIRM_EMAIL
              help: PLUGIN_W4OS.ADMIN_CONFIRM_EMAIL_HELP
              options: { 1: PLUGIN_ADMIN.ENABLED, 0: PLUGIN_ADMIN.DISABLED }
              validate: { type: bool }
            register.terms:
              type: text
              label: PLUGIN_W4OS.ADMIN_TERMS
              help: PLUGIN_W4OS.ADMIN_TERMS_HELP
              placeholder: '/terms'
            manager_level:
              type: number
              label: PLUGIN_W4OS.ADMIN_MANAGER_LEVEL
              help: PLUGIN_W4OS.ADMIN_MANAGER_LEVEL_HELP
              validate: { type: int, min: 1 }
            send_mail:
              type: toggle
              label: PLUGIN_W4OS.ADMIN_SEND_MAIL
              help: PLUGIN_W4OS.ADMIN_SEND_MAIL_HELP
              options: { 1: PLUGIN_ADMIN.ENABLED, 0: PLUGIN_ADMIN.DISABLED }
              validate: { type: bool }
            save_accounts:
              type: toggle
              label: PLUGIN_W4OS.ADMIN_SAVE_ACCOUNTS
              help: PLUGIN_W4OS.ADMIN_SAVE_ACCOUNTS_HELP
              options: { 1: PLUGIN_ADMIN.ENABLED, 0: PLUGIN_ADMIN.DISABLED }
              validate: { type: bool }

        tab_pages:
          type: tab
          title: PLUGIN_W4OS.ADMIN_TAB_PAGES
          fields:
            routes.register: { type: text, label: PLUGIN_W4OS.REGISTER_TITLE }
            routes.confirm: { type: text, label: PLUGIN_W4OS.CONFIRM_TITLE }
            routes.forgot: { type: text, label: PLUGIN_W4OS.FORGOT_TITLE }
            routes.reset: { type: text, label: PLUGIN_W4OS.RESET_TITLE }
            routes.account: { type: text, label: PLUGIN_W4OS.ACCOUNT_TITLE }
            routes.manage: { type: text, label: PLUGIN_W4OS.MANAGE_TITLE }
