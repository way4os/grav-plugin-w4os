name: W4OS
slug: w4os
type: plugin
version: 0.1.0
description: The website of an OpenSimulator grid, as a thin bridge to the OpenSim engine API - avatars register with a model and confirm their email, sign in, manage their account and find a new password; the managers of the grid manage the avatars; pages show the blocks of the helpers.
icon: globe
license: AGPL-3.0-or-later
author:
  name: Magìiíc
homepage: https://w4os.org
keywords: opensimulator, opensim, grid, avatar, metaverse
dependencies:
  - { name: grav, version: '>=2.0.0' }
  - { name: form, version: '>=8.0.0' }
  - { name: login, version: '>=3.8.2' }
  - { name: shortcode-core, version: '>=5.0.0' }
form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 1
      options: { 1: PLUGIN_ADMIN.ENABLED, 0: PLUGIN_ADMIN.DISABLED }
      validate: { type: bool }

    tabs:
      type: tabs
      classes: side-tabs
      fields:
        tab_connection:
          type: tab
          title: w4os.admin_tab_connection
          fields:
            engine:
              type: select
              label: w4os.admin_engine
              help: w4os.admin_engine_help
              options:
                remote: w4os.admin_engine_remote
                bundled: w4os.admin_engine_bundled
            section_remote:
              type: section
              title: w4os.admin_engine_remote
              underline: true
            url:
              type: url
              label: w4os.admin_url
              help: w4os.admin_url_help
              placeholder: 'https://grid.example.org/helpers'
            api_key:
              type: password
              label: w4os.admin_api_key
              help: w4os.admin_api_key_help
              data-placeholder@: '\Grav\Plugin\W4osPlugin::adminKeyPlaceholder'
            api_url:
              type: url
              label: w4os.admin_api_url
              help: w4os.admin_api_url_help
              placeholder: 'https://grid.example.org/api'
            grid:
              type: text
              label: w4os.admin_grid
              help: w4os.admin_grid_help
            section_bundled:
              type: section
              title: w4os.admin_engine_bundled
              underline: true
            bundled.login:
              type: url
              label: w4os.admin_bundled_login
              help: w4os.admin_bundled_login_help
              placeholder: 'http://grid.example.org:8002'
            bundled.database.host:
              type: text
              label: w4os.admin_db_host
              placeholder: localhost
            bundled.database.port:
              type: number
              label: w4os.admin_db_port
              placeholder: 3306
            bundled.database.name:
              type: text
              label: w4os.admin_db_name
            bundled.database.user:
              type: text
              label: w4os.admin_db_user
            bundled.database.password:
              type: password
              label: w4os.admin_db_password
              help: w4os.admin_db_password_help
            serve_helpers:
              type: toggle
              label: w4os.admin_serve_helpers
              help: w4os.admin_serve_helpers_help
              options: { 1: PLUGIN_ADMIN.ENABLED, 0: PLUGIN_ADMIN.DISABLED }
              validate: { type: bool }
            bundled.opensim_conf:
              type: text
              label: w4os.admin_opensim_conf
              help: w4os.admin_opensim_conf_help
              placeholder: '/etc/opensim/opensim.conf'
            built_in_css:
              type: toggle
              label: w4os.admin_built_in_css
              help: w4os.admin_built_in_css_help
              options: { 1: PLUGIN_ADMIN.ENABLED, 0: PLUGIN_ADMIN.DISABLED }
              validate: { type: bool }
            cache:
              type: number
              label: w4os.admin_cache
              validate: { type: int, min: 0 }

        tab_accounts:
          type: tab
          title: w4os.admin_tab_accounts
          fields:
            register.enabled:
              type: toggle
              label: w4os.admin_register
              options: { 1: PLUGIN_ADMIN.ENABLED, 0: PLUGIN_ADMIN.DISABLED }
              validate: { type: bool }
            register.confirm_email:
              type: toggle
              label: w4os.admin_confirm_email
              help: w4os.admin_confirm_email_help
              options: { 1: PLUGIN_ADMIN.ENABLED, 0: PLUGIN_ADMIN.DISABLED }
              validate: { type: bool }
            register.terms:
              type: text
              label: w4os.admin_terms
              help: w4os.admin_terms_help
              placeholder: '/terms'
            manage.per_page:
              type: number
              label: w4os.admin_per_page
              help: w4os.admin_per_page_help
              validate: { type: int, min: 1, max: 500 }
            admin_level:
              type: select
              label: w4os.admin_admin_level
              help: w4os.admin_admin_level_help
              default: 100
              data-options@: '\W4os\Grav\Site::adminLevels'
              validate: { type: int }
            send_mail:
              type: toggle
              label: w4os.admin_send_mail
              help: w4os.admin_send_mail_help
              options: { 1: PLUGIN_ADMIN.ENABLED, 0: PLUGIN_ADMIN.DISABLED }
              validate: { type: bool }
            save_accounts:
              type: toggle
              label: w4os.admin_save_accounts
              help: w4os.admin_save_accounts_help
              options: { 1: PLUGIN_ADMIN.ENABLED, 0: PLUGIN_ADMIN.DISABLED }
              validate: { type: bool }

        tab_pages:
          type: tab
          title: w4os.admin_tab_pages
          fields:
            routes.register: { type: text, label: w4os.register_title }
            routes.confirm: { type: text, label: w4os.confirm_title }
            routes.forgot: { type: text, label: w4os.forgot_title }
            routes.reset: { type: text, label: w4os.reset_title }
            routes.account: { type: text, label: w4os.edit_profile }
            routes.dashboard: { type: text, label: w4os.dashboard_title }
            routes.manage: { type: text, label: w4os.manage_title }
            routes.edit: { type: text, label: w4os.action_edit }
            routes.regions: { type: text, label: w4os.regions_title }
            routes.region: { type: text, label: w4os.column_region }
            routes.simulators: { type: text, label: w4os.simulators_title }
            routes.search: { type: text, label: w4os.search }
            routes.profile: { type: text, label: w4os.profile_title }
            routes.guide: { type: text, label: w4os.guide_title }
