  VERIFY_EMAIL_CHANGE: 'Confirmer les changements d’e-mail'
  VERIFY_EMAIL_CHANGE_HELP: 'Quand quelqu’un change son e-mail dans son profil, un lien part vers la nouvelle adresse et le compte ne bascule qu’une fois ce lien ouvert. Les administrateurs qui modifient un compte ne sont pas concernés.'
  ROUTE_CONFIRM_EMAIL: 'Chemin de confirmation du changement d’e-mail'
  EMAIL_CHANGE_SENT: 'Un lien de confirmation est parti vers %s. Ton adresse e-mail change dès que tu l’ouvres.'
  EMAIL_CHANGE_WAITING: 'Ton changement pour <strong>%1$s</strong> est en attente. Ouvre le lien envoyé à cette adresse pour le confirmer. D’ici là, ton compte garde <strong>%2$s</strong>.'
  EMAIL_CHANGE_RESEND: 'Renvoyer le lien'
  EMAIL_CHANGE_CANCEL: 'Annuler le changement'
  EMAIL_CHANGE_CANCELLED: 'Changement d’e-mail annulé. Ton compte garde %s.'
