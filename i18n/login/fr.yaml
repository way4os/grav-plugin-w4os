  EMAIL_CHANGE_LINK_INVALID: 'Ce lien ne marche plus. Il a peut-être déjà servi, ou été remplacé par un plus récent.'
  EMAIL_CHANGE_TOO_MANY: 'Trop de demandes de changement d’e-mail. Réessaie dans %s minutes.'
  EMAIL_CHANGE_EMAIL_SUBJECT: 'Confirme ta nouvelle adresse e-mail sur %s'
  EMAIL_CHANGE_EMAIL_BODY: '<h1>Confirme ton adresse e-mail</h1><p>Bonjour %1$s,</p><p>Tu as demandé à remplacer l’adresse e-mail de ton compte sur <b>%3$s</b> par celle-ci. Clique sur le bouton ci-dessous pour la confirmer. D’ici là, ton compte garde son adresse actuelle.</p><p><br/><a href="%2$s" class="btn-primary">Confirmer mon adresse e-mail</a><br/><br/></p><p>Ou colle ce lien dans ton navigateur :</p><p class="word-break"><a href="%2$s">%2$s</a></p><p>Le lien marche pendant 24 heures. Si tu n’as pas demandé ce changement, ignore cet e-mail : rien ne changera.</p><p><br/>Cordialement,<br/><br/>%4$s</p>'
  EMAIL_CHANGED_EMAIL_SUBJECT: 'Ton adresse e-mail sur %s a changé'
  EMAIL_CHANGED_EMAIL_BODY: '<h1>Adresse e-mail changée</h1><p>Bonjour %1$s,</p><p>L’adresse e-mail de ton compte sur <b>%2$s</b> est maintenant <b>%3$s</b> : c’est là que les e-mails du site arriveront désormais.</p><p>Si c’est toi qui as fait ce changement, tu n’as rien d’autre à faire. Sinon, contacte tout de suite l’administrateur du site.</p><p><br/>Cordialement,<br/><br/>%4$s</p>'
  EMAIL_CHANGE_REQUESTED_EMAIL_SUBJECT: 'Quelqu’un a demandé à changer ton adresse e-mail sur %s'
  EMAIL_CHANGE_REQUESTED_EMAIL_BODY: '<h1>Changement d’e-mail demandé</h1><p>Bonjour %1$s,</p><p>Quelqu’un a demandé à remplacer l’adresse e-mail de ton compte sur <b>%2$s</b> par <b>%3$s</b>. Rien ne change tant que le lien envoyé à cette adresse n’est pas ouvert.</p><p>Si c’était toi, tu n’as rien à faire. Sinon, annule le changement maintenant :</p><p><br/><a href="%4$s" class="btn-primary">Annuler le changement</a><br/><br/></p><p>Ou colle ce lien dans ton navigateur :</p><p class="word-break"><a href="%4$s">%4$s</a></p><p>Ensuite, change ton mot de passe ou contacte l’administrateur du site : quelqu’un d’autre a peut-être accès à ton compte.</p><p><br/>Cordialement,<br/><br/>%5$s</p>'
  EMAIL_CHANGE_CANCELLED_BY_LINK: 'Le changement d’e-mail est annulé et ton compte garde %s. Si tu ne l’avais pas demandé, quelqu’un d’autre a peut-être accès à ton compte : change ton mot de passe ou contacte l’administrateur du site.'
  EMAIL_CHANGE_CANCEL_LINK_INVALID: 'Ce lien ne marche plus. Le changement a peut-être déjà été annulé ou confirmé, ou remplacé par un plus récent.'
