  PASSKEYS: 'Clés d’accès'
  PASSKEYS_ENABLED: 'Clés d’accès'
  PASSKEYS_ENABLED_HELP: 'Permet aux comptes d’ajouter des clés d’accès dans leur profil et de se connecter avec, sur le site et dans l’Admin, sans mot de passe. Une clé d’accès remplace aussi le code d’authentification en deux étapes. Nécessite Grav 2 et HTTPS'
  PASSKEYS_HELP: 'Une clé d’accès te connecte avec ton empreinte, ton visage ou le code PIN de ton appareil, depuis un gestionnaire de mots de passe comme 1Password, le trousseau iCloud ou le Gestionnaire de mots de passe de Google, ou avec une clé de sécurité. Elle marche sur ce site et dans l’Admin.'
  PASSKEYS_RP_ID: 'Domaine des clés d’accès'
  PASSKEYS_RP_ID_HELP: 'L’hôte auquel appartiennent les clés d’accès. Laisse vide pour utiliser l’hôte de ce site. Un domaine parent (example.com pour www.example.com) permet aux clés d’accès de marcher sur tous ses sous-domaines'
  PASSKEYS_ORIGIN: 'Origine des clés d’accès'
  PASSKEYS_ORIGIN_HELP: 'L’adresse que les navigateurs indiquent quand ils utilisent une clé d’accès, comme https://example.com. Laisse vide pour utiliser system.custom_base_url, sinon l’adresse de la requête. À remplir quand le site est derrière un proxy qui change le schéma ou le port'
