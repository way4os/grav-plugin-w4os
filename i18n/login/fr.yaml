PLUGIN_LOGIN:
  ALREADY_REGISTERED_EMAIL_SUBJECT: '%s : tentative d’inscription'
  ALREADY_REGISTERED_EMAIL_BODY: '<h1>Tentative d’inscription</h1><p>Bonjour,</p><p>Quelqu’un vient d’essayer de créer un compte sur <b>%1$s</b> avec cette adresse e-mail. Tu as déjà un compte ici, donc rien n’a changé.</p><p>Si c’était toi et que tu ne te souviens plus de ton mot de passe, tu peux le réinitialiser :</p><p><br/><a href="%2$s" class="btn-primary">Réinitialiser mon mot de passe</a><br/><br/></p><p>Tu peux aussi copier l’URL suivante dans la barre d’adresse de ton navigateur :</p><p class="word-break"><a href="%2$s">%2$s</a></p><p>Si ce n’était pas toi, tu peux ignorer ce message sans crainte.</p><p><br/>Cordialement,<br/><br/>%3$s</p>'
  SHOW_PASSWORD_FORM: 'Afficher le formulaire de mot de passe'
  SHOW_PASSWORD_FORM_HELP: 'Affiche le formulaire du nom d’utilisateur et du mot de passe sur la page de connexion du site ; les écrans de connexion de l’Admin ne sont pas concernés (Admin2 a son propre réglage dans le plugin API). Désactive-le pour ne proposer que d’autres façons de se connecter, comme les boutons d’authentification unique ou la connexion par lien ; le formulaire reste affiché s’il n’y en a aucune. Le masquer n’empêche pas les connexions par mot de passe. D’autres plugins peuvent remplacer ce réglage.'
