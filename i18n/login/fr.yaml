  PROFILE_NOT_UPDATED: 'Ton profil n’a pas pu être mis à jour'
  HOST_WARNING: '<div style="background-color: #FFEDAD; color: #725F1C; border: 1px solid #FFD74E; padding: 10px; margin: 10px 0; border-radius: 5px;">NOTE : si tu n’as pas demandé cet e-mail ou si tu ne reconnais pas le site d’où il vient (<strong>« %s »</strong>), ignore-le ou supprime-le.</div>'
  SITE_HOST: 'Hôte du site'
  SITE_HOST_HELP: 'Pour plus de sécurité, impose cette URL dans tous les e-mails de réinitialisation du mot de passe, d’activation, de connexion par lien et d’invitation. Laisse vide pour utiliser l’URL par défaut du site'
  REQUIRE_TRUSTED_HOST: 'Exiger un hôte de confiance'
  REQUIRE_TRUSTED_HOST_HELP: 'Si activé, les e-mails de réinitialisation du mot de passe, d’activation, de connexion par lien et d’invitation ne partent que si l’Hôte du site (ou l’URL de base personnalisée du cœur) est configuré, au lieu de reprendre l’hôte de la requête. Empêche ces liens de pointer vers un hôte usurpé'
  FORGOT_TEMPORARILY_UNAVAILABLE: 'La réinitialisation du mot de passe est momentanément indisponible. Contacte l’administrateur du site.'
  UNTRUSTED_HOST_NOTICE: 'Les liens des e-mails ne sont pas encore fixés sur un hôte de confiance : les e-mails de réinitialisation du mot de passe, d’activation, de connexion par lien et d’invitation reprennent donc l’hôte de la requête. <a href="https://learn.getgrav.org/security/trusted-host" target="_blank" rel="noopener">Comment corriger ça</a>'
