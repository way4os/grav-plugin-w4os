  EMAIL_CHANGE_EMAIL_SUBJECT: 'Bestätige deine neue E-Mail-Adresse bei %s'
  EMAIL_CHANGE_EMAIL_BODY: '<h1>Bestätige deine E-Mail-Adresse</h1><p>Hallo %1$s,</p><p>du möchtest die E-Mail-Adresse deines Kontos bei <b>%3$s</b> auf diese ändern. Klicke auf den Button unten, um sie zu bestätigen. Bis dahin behält dein Konto seine bisherige Adresse.</p><p><br/><a href="%2$s" class="btn-primary">E-Mail-Adresse bestätigen</a><br/><br/></p><p>Oder kopiere diesen Link in deinen Browser:</p><p class="word-break"><a href="%2$s">%2$s</a></p><p>Der Link gilt 24 Stunden. Wenn du diese Änderung nicht angefragt hast, ignoriere diese E-Mail, dann ändert sich nichts.</p><p><br/>Viele Grüße,<br/><br/>%4$s</p>'
  EMAIL_CHANGED_EMAIL_SUBJECT: 'Deine E-Mail-Adresse bei %s wurde geändert'
  EMAIL_CHANGED_EMAIL_BODY: '<h1>E-Mail-Adresse geändert</h1><p>Hallo %1$s,</p><p>die E-Mail-Adresse deines Kontos bei <b>%2$s</b> ist jetzt <b>%3$s</b>. E-Mails der Website gehen ab sofort dorthin.</p><p>Wenn du das warst, musst du nichts weiter tun. Wenn nicht, wende dich sofort an die Verwalter der Website.</p><p><br/>Viele Grüße,<br/><br/>%4$s</p>'
  EMAIL_CHANGE_REQUESTED_EMAIL_SUBJECT: 'Jemand möchte deine E-Mail-Adresse bei %s ändern'
  EMAIL_CHANGE_REQUESTED_EMAIL_BODY: '<h1>E-Mail-Änderung angefragt</h1><p>Hallo %1$s,</p><p>jemand möchte die E-Mail-Adresse deines Kontos bei <b>%2$s</b> auf <b>%3$s</b> ändern. Es ändert sich nichts, bis der Link geöffnet wird, den wir an diese Adresse geschickt haben.</p><p>Wenn du das warst, musst du nichts tun. Wenn nicht, brich die Änderung jetzt ab:</p><p><br/><a href="%4$s" class="btn-primary">Änderung abbrechen</a><br/><br/></p><p>Oder kopiere diesen Link in deinen Browser:</p><p class="word-break"><a href="%4$s">%4$s</a></p><p>Ändere danach dein Passwort oder wende dich an die Verwalter der Website, denn vielleicht kann sich jemand anderes in deinem Konto anmelden.</p><p><br/>Viele Grüße,<br/><br/>%5$s</p>'
  EMAIL_CHANGE_CANCELLED_BY_LINK: 'Die E-Mail-Änderung ist abgebrochen, dein Konto nutzt weiter %s. Wenn du sie nicht angefragt hast, kann sich vielleicht jemand anderes in deinem Konto anmelden: Ändere dein Passwort oder wende dich an die Verwalter der Website.'
  EMAIL_CHANGE_CANCEL_LINK_INVALID: 'Dieser Link funktioniert nicht mehr. Vielleicht wurde die Änderung schon abgebrochen oder bestätigt oder durch eine neuere ersetzt.'
